<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeWalk · Admin sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="admin-body"><main class="login-card"><a class="brand" href="/">SafeWalk</a><h1>Admin sign in</h1><p class="muted">Review community reports.</p>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">Username</label><input id="username" name="username" maxlength="80" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required><button class="primary full">Sign in</button></form><p class="small muted">Create your account using the create-admin command in README.md.</p><a href="/">← Return to map</a></main></body></html>
